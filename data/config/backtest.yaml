# Phase 5 Hormuz 2026 backtest — values locked before first harness run.
backtest:
  window_start: "2026-02-01"
  window_end: "2026-06-30"
  corridor: HORMUZ
  # Locked 2026-07-13 from the clean Jan 15–31 baseline: max score 0.437500,
  # so 0.437501 gives 0/17 observed baseline alerts at the <=5% target.
  risk_threshold: 0.437501
  reference_point_date: "2026-03-02"
  reference_point_label: "EIA-documented March 2 Strait of Hormuz closure reference"
  seed: 42
  n_simulations: 200
  # Six-hour GDELT sampling from 2026-01-15 through the locked 2026-03-02 reference date.
  cache_path: data/samples/gdelt_hormuz_backtest_dense.json
  timeline_path: data/hormuz_2026_timeline.csv
  ground_truth_compare_date: "2026-03-11"
